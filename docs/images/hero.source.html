<!doctype html>
<html><head><meta charset="utf-8">
<!-- Source of hero.png. Render: "Google Chrome" --headless --disable-gpu --hide-scrollbars --force-device-scale-factor=1.5 --window-size=1600,640 --screenshot=hero.png file://$PWD/hero.source.html -->
<style>
  html,body{margin:0;padding:0;background:#0b1220;}
  body{width:1600px;height:640px;overflow:hidden;font-family:-apple-system,"Segoe UI","Helvetica Neue",Helvetica,Arial,sans-serif;}
  svg{display:block}
  .mono{font-family:"SF Mono",Menlo,Consolas,monospace}
</style></head>
<body>
<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="640" viewBox="0 0 1600 640">
  <defs>
    <radialGradient id="glow" cx="1250" cy="320" r="520" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#0078d4" stop-opacity="0.38"/>
      <stop offset="0.55" stop-color="#0078d4" stop-opacity="0.08"/>
      <stop offset="1" stop-color="#0078d4" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="bg" x1="0" y1="0" x2="1600" y2="640" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#0b1220"/>
      <stop offset="1" stop-color="#0e1a33"/>
    </linearGradient>
    <linearGradient id="chain" x1="80" y1="0" x2="760" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#38bdf8"/>
      <stop offset="0.5" stop-color="#0078d4"/>
      <stop offset="1" stop-color="#22c55e"/>
    </linearGradient>
    <pattern id="dots" width="28" height="28" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="1" fill="#ffffff" fill-opacity="0.06"/>
    </pattern>
  </defs>

  <rect width="1600" height="640" fill="url(#bg)"/>
  <rect width="1600" height="640" fill="url(#dots)"/>

  <!-- left: name and promise. Keep the tagline under ~55 characters. -->
  <text x="80" y="150" fill="#38bdf8" font-size="18" font-weight="700" letter-spacing="5">AZURE  ·  POWERSHELL</text>
  <text x="76" y="230" fill="#ffffff" font-size="62" font-weight="800" letter-spacing="-2">CredentialRotation</text>
  <text x="80" y="288" fill="#aab4c8" font-size="28" font-weight="400">For the machines LAPS cannot reach.</text>
  <text x="80" y="330" fill="#6f7d99" font-size="21">Local admin passwords · SSH keys · standalone and DMZ hosts</text>
  <text x="80" y="362" fill="#6f7d99" font-size="21">Runs in your tenant · Bicep or Terraform · MIT</text>

  <g class="mono" font-size="19">
    <line x1="80" y1="470" x2="760" y2="470" stroke="url(#chain)" stroke-width="3" stroke-linecap="round"/>
    <circle cx="80" cy="470" r="9" fill="#0b1220" stroke="#38bdf8" stroke-width="3"/>
    <text x="80" y="510" fill="#8fd3ff" text-anchor="start" font-weight="600">Expiry date</text>
    <circle cx="420" cy="470" r="9" fill="#0078d4" stroke="#38bdf8" stroke-width="3"/>
    <text x="420" y="510" fill="#8fb8ec" text-anchor="middle">Runbook</text>
    <circle cx="760" cy="470" r="9" fill="#22c55e" stroke="#86efac" stroke-width="3"/>
    <text x="760" y="510" fill="#86efac" text-anchor="end" font-weight="600">New credential</text>
    <text x="80" y="548" fill="#55627d" font-size="17">One signal. No event grid, no queue, no orchestrator.</text>
  </g>

  <!-- right: the vault is the only input, and what each answer causes -->
  <rect x="700" y="-200" width="1000" height="1000" fill="url(#glow)"/>

  <text x="900" y="132" class="mono" font-size="17" letter-spacing="2.4" fill="#6f86ab">THE VAULT SAYS</text>
  <text x="1214" y="132" class="mono" font-size="17" letter-spacing="2.4" fill="#8fd3ff">THE NEXT RUN</text>

  <!-- row 1 -->
  <rect x="900" y="156" width="250" height="52" rx="10" fill="#131f36" stroke="#26334d" stroke-width="2"/>
  <text x="918" y="188" font-size="18" fill="#c3d2e8">expires in 3 days</text>
  <path d="M1158 182 H 1194" stroke="#3d5170" stroke-width="2" stroke-dasharray="5 5"/>
  <circle cx="1200" cy="182" r="4" fill="#ef4444"/>
  <rect x="1214" y="156" width="286" height="52" rx="10" fill="#2a0f14" stroke="#7f2a33" stroke-width="2"/>
  <text x="1232" y="180" class="mono" font-size="15" fill="#fca5a5">ROTATE</text>
  <text x="1232" y="199" font-size="16" fill="#e2b8bc">new secret, new expiry date</text>

  <!-- row 2 -->
  <rect x="900" y="230" width="250" height="52" rx="10" fill="#131f36" stroke="#26334d" stroke-width="2"/>
  <text x="918" y="262" font-size="18" fill="#c3d2e8">read at 09:14 by a user</text>
  <path d="M1158 256 H 1194" stroke="#3d5170" stroke-width="2" stroke-dasharray="5 5"/>
  <circle cx="1200" cy="256" r="4" fill="#f59e0b"/>
  <rect x="1214" y="230" width="286" height="52" rx="10" fill="#2a1c08" stroke="#7a5a20" stroke-width="2"/>
  <text x="1232" y="254" class="mono" font-size="15" fill="#f0a52b">EXPIRY PULLED IN</text>
  <text x="1232" y="273" font-size="16" fill="#e0c68f">so the next pass replaces it</text>

  <!-- row 3 -->
  <rect x="900" y="304" width="250" height="52" rx="10" fill="#131f36" stroke="#26334d" stroke-width="2"/>
  <text x="918" y="336" font-size="18" fill="#c3d2e8">expires in 62 days</text>
  <path d="M1158 330 H 1194" stroke="#3d5170" stroke-width="2" stroke-dasharray="5 5"/>
  <circle cx="1200" cy="330" r="4" fill="#22c55e"/>
  <rect x="1214" y="304" width="286" height="52" rx="10" fill="#0e2418" stroke="#2b6040" stroke-width="2"/>
  <text x="1232" y="328" class="mono" font-size="15" fill="#86efac">LEAVE IT</text>
  <text x="1232" y="347" font-size="16" fill="#a8ddb8">nothing to do this run</text>

  <path d="M900 396 H 1500" stroke="#1e2a42" stroke-width="2"/>
  <text x="900" y="432" class="mono" font-size="17" fill="#6f86ab">Every run reconciles the whole estate,</text>
  <text x="900" y="458" class="mono" font-size="17" fill="#5d6f8f">so the schedule is also the retry.</text>

</svg>
</body></html>
